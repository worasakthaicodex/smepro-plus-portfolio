# Copy this file to datasource.properties and provide local values.
ds.database-driver=com.mysql.cj.jdbc.Driver
ds.url=jdbc:mysql://localhost:3306/smepro?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok
ds.username=your_database_user
ds.password=your_database_password
ds.pool=10

# Runtime storage and license paths must remain outside source control.
storage.path=/absolute/path/to/runtime/storage
license.licensePath=/absolute/path/to/license.lic
